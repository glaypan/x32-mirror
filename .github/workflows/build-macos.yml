name: build-macos

# macOS 应用必须在 macOS 上构建（PyInstaller 不支持交叉编译）。
# Intel 构建：Python 3.9 + PyInstaller 5.13（部署目标 10.13/10.9），
# 以兼容 10.14.6 Mojave。

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "target arch"
        type: choice
        default: x86_64
        options: [x86_64, universal2]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==5.13.2" "pywebview==5.4"
          python - <<'PY'
          import PyInstaller, webview, sys
          print("python", sys.version.split()[0])
          print("pyinstaller", PyInstaller.__version__)
          print("pywebview", getattr(webview, "__version__", "ok"))
          PY

      - name: Build .app
        run: python packaging/build_mac.py --arch "${{ inputs.arch || 'x86_64' }}"

      - name: Report deployment target
        run: |
          echo "== main executable =="
          otool -l dist/x32-mirror.app/Contents/MacOS/x32-mirror | grep -A6 LC_BUILD_VERSION || true
          echo "== bundled Python =="
          find dist/x32-mirror.app -name "Python" -type f | head -1 | xargs -I{} otool -l {} | grep -A6 LC_BUILD_VERSION || true

      - uses: actions/upload-artifact@v4
        with:
          name: x32-mirror-macos-${{ inputs.arch || 'x86_64' }}
          path: dist/*.zip
          if-no-files-found: error

name: build-macos

# 打包的是"自带 Python 运行时"的 .app（见 packaging/build_mac_portable.py）：
# 不依赖 PyInstaller，运行时与依赖均以 macOS 10.9 为目标，
# 因此可在 macOS 10.14.6 Mojave 上运行。
# 组装过程只下载官方产物与 wheel，不需要 macOS 机器。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assemble portable .app
        run: python packaging/build_mac_portable.py

      - name: Verify minimum macOS version
        run: |
          mkdir -p /tmp/macpkg
          unzip -q dist/x32-mirror-*-macos-x86_64.zip -d /tmp/macpkg
          python packaging/check_macos.py /tmp/macpkg --max 10.14

      - uses: actions/upload-artifact@v4
        with:
          name: x32-mirror-macos-x86_64
          path: dist/x32-mirror-*-macos-x86_64.zip
          if-no-files-found: error

  # Optional native bundle for 10.15+ / Apple Silicon (not used for release):
  # PyInstaller can only target the macOS version of the build host.
  native:
    if: false
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: echo "disabled"
